name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate converted recipe data
        run: python scripts/verify_recipes.py
      - name: Build mod
        run: ./gradlew build --no-daemon
      - name: Verify packaged JAR
        run: python scripts/verify_jar.py
      - name: Smoke test dedicated server startup
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          mkfifo run/server-input
          ./gradlew runServer --no-daemon --console=plain <run/server-input >run/server.log 2>&1 &
          server_pid=$!
          exec 3>run/server-input
          for attempt in $(seq 1 90); do
            if grep -q 'Done (' run/server.log; then
              printf 'stop\n' >&3
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat run/server.log
              wait "$server_pid" || true
              exit 1
            fi
            sleep 5
          done
          if ! grep -q 'Done (' run/server.log; then
            cat run/server.log
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" || true
            exit 1
          fi
          wait "$server_pid"
          if grep -Ei 'Failed to parse recipe|Failed to load recipe|Unknown item|Unknown fluid' run/server.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: create-ultimate-factory-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
